const B=L.latLngBounds(R);function fit(){map.fitBounds(B,{paddingTopLeft:[60,60],paddingBottomRight:[40,40]})}fit();addEventListener('resize',fit);
let cur=0,tgt=0,an=null,fired=false;
function draw(m){const[s]=seg(m);done.forEach(l=>l.setLatLngs(s));const p=at(m).p;W.setLatLng(p);if(follow)map.setView(p,15,{animate:false});
document.getElementById('d').textContent=m.toFixed(1);document.getElementById('b').style.width=(m/TOT*100)+'%';
document.getElementById('pc').textContent=Math.round(m/TOT*100)+'%';document.getElementById('tg').textContent=Math.max(0,TOT-m).toFixed(1)+' mi to go';
[...mk.children].forEach((b,i)=>{const on=m>=i+1-1e-6;b.classList.toggle('on',on);mms[i].getElement()?.classList.toggle('on',on)})}
function go(m,instant){tgt=Math.max(0,Math.min(TOT,Math.round(m*10)/10));if(instant){cur=tgt;draw(cur)}else{const s=cur,t0=performance.now(),D=1400;cancelAnimationFrame(an);
(function st(n){const k=Math.min(1,(n-t0)/D),e=1-Math.pow(1-k,3);cur=s+(tgt-s)*e;draw(cur);if(k<1)an=requestAnimationFrame(st);else done_()})(t0)}if(instant)done_()}
function done_(){if(tgt>=TOT&&!fired){fired=true;cele()}if(tgt<TOT)fired=false}
function cele(){const f=document.getElementById('fin');f.classList.add('on');for(let i=0;i<120;i++){const c=document.createElement('div');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=['#00e5ff','#fff','#9ff','#4af'][i%4];c.style.animationDelay=Math.random()*1.5+'s';f.appendChild(c)}setTimeout(()=>{f.classList.remove('on');f.querySelectorAll('.cf').forEach(c=>c.remove())},7000)}
const bc='BroadcastChannel'in window?new BroadcastChannel('walk-overlay'):null;
function set(m){m=Math.max(0,Math.min(TOT,Math.round(m*10)/10));try{localStorage.setItem(K,m)}catch(e){}bc&&bc.postMessage(m);pub(m);go(m)}
bc&&(bc.onmessage=e=>go(+e.data));addEventListener('storage',e=>{if(e.key===K)go(+e.newValue||0)});
function act(a){a==='r'?set(0):set(tgt+(+a))}
document.querySelectorAll('#ctl [data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));document.getElementById('tg2').onclick=()=>document.getElementById('ctl').classList.toggle('min');
addEventListener('keydown',e=>{const k=e.key;if(k==='m'||k==='M'||k==='ArrowRight')act('1');else if(k==='ArrowLeft')act('-1');else if(k==='h'||k==='H')act('0.5');else if(k==='r'||k==='R')act('r')});
const qm=q.get('mile');let init=qm!==null?+qm:(()=>{try{return +localStorage.getItem(K)||0}catch(e){return 0}})();fired=init>=TOT;go(init,true);

const ROOM=q.get('room')||'crowwalk-670c7366c069757a',NT='https://ntfy.sh/'+ROOM;
function pub(m){fetch(NT,{method:'POST',body:String(m)}).catch(()=>{})}
function parse(s){const v=parseFloat(s);return isFinite(v)?v:null}
fetch(NT+'/json?poll=1&since=all').then(r=>r.text()).then(t=>{const ls=t.trim().split('\n').map(l=>{try{return JSON.parse(l)}catch(e){}}).filter(x=>x&&x.event==='message');if(ls.length){const v=parse(ls[ls.length-1].message);if(v!==null&&qm===null){fired=v>=TOT;go(v,true)}}}).catch(()=>{});
try{const es=new EventSource(NT+'/sse');es.onmessage=e=>{try{const v=parse(JSON.parse(e.data).message);if(v!==null)go(v)}catch(x){}}}catch(e){}
