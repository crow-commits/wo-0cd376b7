<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Walk Control</title>
<style>body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#0c2a3e,#03070d);color:#e8fbff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px;box-sizing:border-box}
.t{letter-spacing:3px;font-size:12px;color:#7fe9ff;text-transform:uppercase}.big{font-size:72px;font-weight:800;text-shadow:0 0 18px #00e5ff;margin:6px 0}.big small{font-size:22px;color:#9cc}
#st{font-size:14px;margin-bottom:16px}#st.ok{color:#5f9}#st.bad{color:#f77}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px}
button{font-size:24px;font-weight:800;padding:22px 0;border-radius:16px;border:1px solid #2bd;background:#0c2a3e;color:#bff;box-shadow:0 0 14px rgba(0,229,255,.25)}button:active{background:#00d9ff;color:#012}
.p{grid-column:1/3;font-size:34px;padding:32px 0;background:linear-gradient(135deg,#00b8d9,#0a6a8a);color:#fff}
.s{grid-column:1/3;display:flex;gap:8px}.s input{flex:1;font-size:22px;padding:14px;border-radius:14px;border:1px solid #2bd;background:#06131f;color:#fff}.s button{padding:0 22px}
.bar{width:100%;max-width:420px;height:10px;background:rgba(255,255,255,.1);border-radius:6px;margin-bottom:16px;overflow:hidden}.bar i{display:block;height:100%;background:#00e5ff;box-shadow:0 0 12px #00e5ff;width:0}</style></head><body>
<div class="t">Runyon Canyon → Santa Monica Pier</div><div class="big"><span id="d">0.0</span><small> / 10.7 mi</small></div>
<div class="bar"><i id="b"></i></div><div id="st">Connecting…</div>
<div class="g"><button class="p" data-a="1">+1 mile</button><button data-a="0.5">+0.5</button><button data-a="-1">Undo −1</button>
<div class="s"><input id="x" type="number" step="0.1" min="0" max="10.7" placeholder="Set mile"><button id="sx">Set</button></div>
<button class="s" style="display:block;color:#f99;border-color:#a44" id="rs">Reset to 0</button></div>
<script>const TOT=10.7,q=new URLSearchParams(location.search),ROOM=q.get('room')||'crowwalk-670c7366c069757a',NT='https://ntfy.sh/'+ROOM;let cur=0;
const S=(ok,t)=>{const e=document.getElementById('st');e.className=ok?'ok':'bad';e.textContent=t};
function show(m){cur=m;document.getElementById('d').textContent=m.toFixed(1);document.getElementById('b').style.width=m/TOT*100+'%'}
function send(m){m=Math.max(0,Math.min(TOT,Math.round(m*10)/10));show(m);fetch(NT,{method:'POST',body:String(m)}).then(r=>S(r.ok,r.ok?'● Sent '+m.toFixed(1)+' mi':'Send failed ('+r.status+')')).catch(()=>S(false,'Send failed – offline?'))}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>send(cur+ +b.dataset.a));
document.getElementById('rs').onclick=()=>{if(confirm('Reset to 0?'))send(0)};
document.getElementById('sx').onclick=()=>{const v=parseFloat(document.getElementById('x').value);if(isFinite(v))send(v)};
fetch(NT+'/json?poll=1&since=all').then(r=>r.text()).then(t=>{const l=t.trim().split('\n').filter(Boolean).map(JSON.parse).filter(x=>x.event==='message');if(l.length)show(parseFloat(l[l.length-1].message)||0)}).catch(()=>{});
const es=new EventSource(NT+'/sse');es.onopen=()=>S(true,'● Connected');es.onerror=()=>S(false,'Reconnecting…');es.onmessage=e=>{const v=parseFloat(JSON.parse(e.data).message);if(isFinite(v))show(v)};
</script></body></html>
