    :root {
      --navy: #0C2340;
      --navy-deep: #071422;
      --gold: #C99700;
      --green: #00843D;
      --scale: 1;
      --stage-w: 1920px;
      --stage-h: 1080px;
      --fs: 82px;
      --sheen-duration: 4.5s;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-synthesis: none;
    }

    /* Controller mini-preview only. Stream overlays stay fully transparent. */
    html.preview,
    html.preview body {
      color-scheme: dark;
      background: #071422 !important;
    }

    /* Letterbox the w×h stage into the viewport. At exactly w×h, scale is 1. */
    #fit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--stage-w, 1920px);
      height: var(--stage-h, 1080px);
      transform: translate(-50%, -50%) scale(var(--fit-scale, min(100vw / var(--stage-w, 1920px), 100vh / var(--stage-h, 1080px))));
      transform-origin: center center;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    body.is-hidden #stage {
      opacity: 0;
      pointer-events: none;
    }

    .anchor {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .anchor.bottom-center { left: 50%; bottom: 7.5%; transform: translateX(-50%) scale(var(--scale)); transform-origin: center bottom; }
    .anchor.top-center    { left: 50%; top: 7.5%;    transform: translateX(-50%) scale(var(--scale)); transform-origin: center top; }
    .anchor.center        { left: 50%; top: 50%;     transform: translate(-50%, -50%) scale(var(--scale)); transform-origin: center center; }
    .anchor.bottom-left   { left: 3.2%; bottom: 7.5%; transform: scale(var(--scale)); transform-origin: left bottom; }
    .anchor.bottom-right  { right: 3.2%; bottom: 7.5%; transform: scale(var(--scale)); transform-origin: right bottom; }
    .anchor.top-left      { left: 3.2%; top: 7.5%; transform: scale(var(--scale)); transform-origin: left top; }
    .anchor.top-right     { right: 3.2%; top: 7.5%; transform: scale(var(--scale)); transform-origin: right top; }

    .lockup {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      -webkit-font-smoothing: antialiased;
      font-size: var(--fs, 82px);
    }

    /* ---- Style A: one navy badge containing the whole lockup ---- */
    body.style-block .lockup {
      padding: 0.26em 0.78em 0.36em;
      background:
        linear-gradient(
          180deg,
          rgba(22, 52, 92, 0.88) 0%,
          rgba(12, 35, 64, 0.91) 42%,
          rgba(7, 20, 34, 0.93) 100%
        );
      border: 2.5px solid #C99700;
      border-radius: 22px;
      box-shadow:
        0 0 0 1px rgba(7, 20, 34, 0.95),
        0 0 0 5px rgba(201, 151, 0, 0.28),
        inset 0 1px 0 rgba(255, 246, 200, 0.32),
        inset 0 -18px 28px rgba(0, 0, 0, 0.18),
        0 8px 10px rgba(0, 0, 0, 0.35),
        0 18px 36px rgba(0, 0, 0, 0.40);
    }

    body.style-block .lockup::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(201, 151, 0, 0.55);
      border-radius: 15px;
      pointer-events: none;
      z-index: 0;
    }

    body.style-block.anim-on .lockup {
      animation: enter 0.7s ease-out both, badge-glow 4.5s ease-in-out 0.7s infinite;
    }

    @keyframes badge-glow {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(7, 20, 34, 0.95),
          0 0 0 5px rgba(201, 151, 0, 0.24),
          inset 0 1px 0 rgba(255, 246, 200, 0.32),
          inset 0 -18px 28px rgba(0, 0, 0, 0.18),
          0 8px 10px rgba(0, 0, 0, 0.35),
          0 18px 36px rgba(0, 0, 0, 0.40);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(7, 20, 34, 0.95),
          0 0 0 6px rgba(232, 197, 71, 0.42),
          inset 0 1px 0 rgba(255, 246, 200, 0.42),
          inset 0 -18px 28px rgba(0, 0, 0, 0.18),
          0 8px 10px rgba(0, 0, 0, 0.35),
          0 18px 36px rgba(0, 0, 0, 0.40);
      }
    }

    /* ---- Style B: loose letters, heavy navy outline + dark halo ---- */
    body.style-text .lockup {
      padding: 0.08em 0.20em 0.06em;
      background: none;
      border: none;
      border-radius: 0;
      box-shadow: none;
      filter:
        drop-shadow(0 0 2px rgba(0, 0, 0, 0.95))
        drop-shadow(0 0 8px rgba(0, 0, 0, 0.55))
        drop-shadow(0 5px 12px rgba(0, 0, 0, 0.50));
    }

    body.style-text .lockup::before { content: none; }

    body.style-text.anim-on .lockup,
    body.style-block.anim-on .lockup {
      /* block already sets a combined animation; text only needs enter */
    }

    body.style-text.anim-on .lockup {
      animation: enter 0.7s ease-out both;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    body.anim-off .lockup,
    body.anim-off.style-block .lockup {
      animation: none;
      opacity: 1;
      transform: none;
    }

    .crest {
      position: relative;
      z-index: 1;
      width: 0.62em;
      height: 0.74em;
      margin-bottom: 0.10em;
      flex: 0 0 auto;
      overflow: visible;
    }

    body.style-block .crest {
      filter:
        drop-shadow(0 1px 0 #071422)
        drop-shadow(0 3px 4px rgba(0, 0, 0, 0.45));
    }

    body.style-text .crest {
      filter:
        drop-shadow(0 0 2px #000)
        drop-shadow(0 2px 0 #071422)
        drop-shadow(0 5px 8px rgba(0, 0, 0, 0.7));
    }

    .line {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word, .for-word {
      position: relative;
      display: inline-block;
      font-family: "Graduate", "Alfa Slab One", Rockwell, "Trajan Pro", "Arial Black", "Times New Roman", serif;
      font-weight: 400;
      font-size: var(--fs, 82px);
      line-height: 1.05;
      white-space: nowrap;
      text-align: center;
    }

    .name .word {
      letter-spacing: 0.08em;
      padding: 0.02em 0.06em 0.04em;
    }

    .title .word {
      font-size: calc(var(--fs, 82px) * 1.18);
      letter-spacing: 0.145em;
      padding: 0.02em 0.04em 0.06em 0.18em;
    }

    .word .stroke,
    .word .fill,
    .for-word .stroke,
    .for-word .fill {
      display: block;
    }

    .word .fill,
    .for-word .fill {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
    }

    body.style-block .word .stroke {
      color: var(--navy-deep);
      -webkit-text-stroke: 0.055em #071422;
      text-shadow:
        0 2px 0 rgba(7, 20, 34, 0.85),
        0 3px 8px rgba(0, 0, 0, 0.35);
    }

    body.style-text .word .stroke {
      color: #050b14;
      -webkit-text-stroke: 0.12em #071422;
      text-shadow:
        0 0 4px rgba(0, 0, 0, 1),
        0 2px 0 #050b14,
        0 4px 0 rgba(7, 20, 34, 0.85),
        0 8px 14px rgba(0, 0, 0, 0.75),
        0 2px 10px rgba(0, 0, 0, 0.9);
    }

    .word .fill {
      background-image:
        linear-gradient(
          105deg,
          transparent 0%,
          transparent 40%,
          rgba(255, 244, 196, 0) 45%,
          rgba(255, 252, 230, 0.95) 50%,
          rgba(255, 228, 130, 0.6) 54%,
          transparent 59%,
          transparent 100%
        ),
        linear-gradient(
          180deg,
          #FFF6C8 0%,
          #F6E27A 14%,
          #E0B422 32%,
          #C99700 48%,
          #8A6800 66%,
          #D4A812 86%,
          #C99700 100%
        );
      background-size: 220% 100%, 100% 100%;
      background-position: 120% 0, 0 0;
      background-repeat: no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    body.anim-on .word .fill {
      animation: sheen var(--sheen-duration, 4.5s) ease-in-out 0.5s infinite;
    }

    body.anim-off .word .fill {
      animation: none;
      background-position: 120% 0, 0 0;
    }

    @keyframes sheen {
      0%, 12%    { background-position: 120% 0, 0 0; }
      38%, 100%  { background-position: -30% 0, 0 0; }
    }

    .for-row {
      gap: 0.40em;
      margin: 0.16em 0 0.12em;
      width: 100%;
    }

    .rule {
      display: block;
      width: 2.2em;
      height: 2px;
      border-radius: 1px;
      background: linear-gradient(90deg, rgba(201, 151, 0, 0), #E8C547 18%, #C99700 50%, #E8C547 82%, rgba(201, 151, 0, 0));
      flex: 1 1 auto;
      max-width: 3.0em;
      min-width: 1.2em;
    }

    body.style-text .rule {
      height: 3px;
      box-shadow:
        0 1px 0 #071422,
        0 0 0 1px rgba(7, 20, 34, 0.85),
        0 3px 6px rgba(0, 0, 0, 0.55);
    }

    .for-word {
      font-size: calc(var(--fs, 82px) * 0.42);
      letter-spacing: 0.34em;
      padding: 0.05em 0.05em 0.08em 0.34em;
      line-height: 1;
    }

    body.style-block .for-word .stroke {
      color: #005c2a;
      -webkit-text-stroke: 0.06em #071422;
      text-shadow: 0 1px 0 rgba(7, 20, 34, 0.7);
    }

    body.style-text .for-word .stroke {
      color: #032010;
      -webkit-text-stroke: 0.14em #071422;
      text-shadow:
        0 0 4px rgba(0, 0, 0, 1),
        0 2px 0 #050b14,
        0 5px 10px rgba(0, 0, 0, 0.7);
    }

    .for-word .fill {
      background-image: none;
      background: linear-gradient(180deg, #4adf86 0%, #14b356 45%, #00843D 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    /* ---- Block-style times-said counter ---- */
    .counter {
      display: none;
      position: relative;
      z-index: 1;
      width: 100%;
      margin-top: 0.22em;
      flex-direction: column;
      align-items: center;
    }

    body.style-block .counter {
      display: flex;
    }

    .counter-rule {
      width: 100%;
      height: 1px;
      margin: 0 0 0.20em;
      background: linear-gradient(90deg, rgba(201, 151, 0, 0), rgba(201, 151, 0, 0.75) 18%, #C99700 50%, rgba(201, 151, 0, 0.75) 82%, rgba(201, 151, 0, 0));
    }

    .count-label {
      font-family: "Graduate", "Alfa Slab One", Rockwell, "Arial Black", sans-serif;
      font-size: 0.52em; /* ~2.6x the previous 0.20em, legible at 1080p */
      letter-spacing: 0.26em;
      padding-left: 0.26em;
      color: #F6E27A;
      text-transform: uppercase;
      margin: 0 0 0.08em;
      line-height: 1;
      -webkit-text-stroke: 0.06em #071422;
      paint-order: stroke fill;
      text-shadow:
        0 2px 0 rgba(7, 20, 34, 0.85),
        0 3px 8px rgba(0, 0, 0, 0.35);
    }

    .count-figure {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Graduate", "Alfa Slab One", Rockwell, "Arial Black", "Times New Roman", serif;
      font-size: 0.78em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      transform-origin: center center;
    }

    /* Invisible "000,000" sizer reserves the max six-digit width so the badge never shifts. */
    .count-sizer {
      display: flex;
      align-items: center;
      visibility: hidden;
      pointer-events: none;
    }

    .count-value {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .count-slot,
    .count-comma {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex: 0 0 auto;
    }

    .count-slot { width: 0.66em; }
    .count-comma { width: 0.34em; }

    /* Hidden leading glyphs collapse in the visible row so the number stays centered. */
    .count-value .count-slot.is-leading,
    .count-value .count-comma.is-leading {
      width: 0;
      overflow: hidden;
      visibility: hidden;
    }

    .count-slot .stroke,
    .count-slot .fill,
    .count-comma .stroke,
    .count-comma .fill {
      display: block;
    }

    .count-slot .fill,
    .count-comma .fill {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
    }

    .count-slot .stroke,
    .count-comma .stroke {
      color: #071422;
      -webkit-text-stroke: 0.055em #071422;
      text-shadow:
        0 2px 0 rgba(7, 20, 34, 0.85),
        0 3px 8px rgba(0, 0, 0, 0.35);
    }

    .count-slot .fill,
    .count-comma .fill {
      background-image:
        linear-gradient(
          180deg,
          #FFF6C8 0%,
          #F6E27A 18%,
          #E0B422 40%,
          #C99700 58%,
          #8A6800 78%,
          #D4A812 100%
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    body.anim-on .count-figure.is-pop {
      animation: count-pop 0.42s cubic-bezier(0.2, 1.15, 0.3, 1);
    }

    body.anim-on .count-figure.is-pop .fill {
      background-image: linear-gradient(180deg, #ffffff 0%, #FFF6C8 25%, #F6E27A 55%, #E8C547 100%);
    }

    @keyframes count-pop {
      0%   { transform: scale(1); }
      28%  { transform: scale(1.16); filter: drop-shadow(0 0 14px rgba(246, 226, 122, 0.9)); }
      100% { transform: scale(1); filter: none; }
    }

    .count-meter {
      display: flex;
      align-items: center;
      gap: 0.32em;
      width: 86%;
      margin-top: 0.18em;
    }

    .count-track {
      flex: 1 1 auto;
      height: 0.09em;
      min-height: 6px;
      border-radius: 99px;
      background: rgba(7, 20, 34, 0.65);
      box-shadow: inset 0 0 0 1px rgba(201, 151, 0, 0.35);
      overflow: hidden;
    }

    .count-fill {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #8A6800, #C99700, #F6E27A);
      box-shadow: 0 0 8px rgba(232, 197, 71, 0.45);
      transition: width 0.28s ease;
    }

    .counter.is-goal .count-fill {
      background: linear-gradient(90deg, #C99700, #FFF6C8, #E8C547);
      box-shadow: 0 0 12px rgba(246, 226, 122, 0.7);
    }

    .count-goal {
      flex: 0 0 auto;
      font-family: "Graduate", "Alfa Slab One", Rockwell, sans-serif;
      font-size: 0.42em; /* ~2.6x the previous 0.16em, matches the TIMES SAID bump */
      letter-spacing: 0.08em;
      color: #F6E27A;
      white-space: nowrap;
      line-height: 1;
      -webkit-text-stroke: 0.06em #071422;
      paint-order: stroke fill;
      text-shadow:
        0 2px 0 rgba(7, 20, 34, 0.85),
        0 3px 8px rgba(0, 0, 0, 0.35);
    }

    body.anim-off .count-figure.is-pop {
      animation: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .shamrock path.vein {
      fill: none;
      stroke: #C99700;
      stroke-width: 1.1;
      stroke-linecap: round;
      opacity: 0.9;
    }

    .shamrock path.stem {
      fill: none;
      stroke: #0C2340;
      stroke-width: 2.1;
      stroke-linecap: round;
    }

    .shamrock path.stem-gold {
      fill: none;
      stroke: #00843D;
      stroke-width: 1.15;
      stroke-linecap: round;
    }

    @media (prefers-reduced-motion: reduce) {
      body.anim-on .lockup,
      body.anim-on.style-block .lockup,
      body.anim-on .word .fill,
      body.anim-on .count-figure.is-pop {
        animation: none !important;
      }
      body.anim-on .word .fill {
        background-position: 120% 0, 0 0;
      }
      .count-fill { transition: none; }
      #stage { transition: none; }
    }
  </style>
</head>
<body class="style-block anim-on">
  <div id="fit">
    <div id="stage">
      <div class="anchor bottom-center" id="anchor">
        <div class="lockup" id="lockup" role="img" aria-label="CJ Carr for Heisman">
          <svg class="crest shamrock" viewBox="0 0 60 72" aria-hidden="true" focusable="false">
            <g fill="#00843D" stroke="#0C2340" stroke-width="1.7" stroke-linejoin="round">
              <ellipse cx="30.3" cy="17.4" rx="13.8" ry="13.5"/>
              <ellipse cx="17.2" cy="32.6" rx="13.4" ry="13.7"/>
              <ellipse cx="42.5" cy="32.2" rx="13.6" ry="13.4"/>
            </g>
            <g fill="#00843D" stroke="none">
              <ellipse cx="30.3" cy="17.4" rx="13.8" ry="13.5"/>
              <ellipse cx="17.2" cy="32.6" rx="13.4" ry="13.7"/>
              <ellipse cx="42.5" cy="32.2" rx="13.6" ry="13.4"/>
            </g>
            <path class="stem" d="M30.2 44.5 C32.4 54 33.2 63.5 29.6 70.5"/>
            <path class="stem-gold" d="M30.2 44.5 C32.4 54 33.2 63.5 29.6 70.5"/>
            <path class="vein" d="M30.3 16.5 C30 24 30 30 30.2 37"/>
            <path class="vein" d="M22 29 C26 32.5 30.2 37 30.2 37"/>
            <path class="vein" d="M38.6 28.8 C35 32.5 30.2 37 30.2 37"/>
          </svg>
          <div class="line name">
            <span class="word">
              <span class="stroke">CJ CARR</span>
              <span class="fill">CJ CARR</span>
            </span>
          </div>
          <div class="line for-row">
            <span class="rule" aria-hidden="true"></span>
            <span class="for-word">
              <span class="stroke">FOR</span>
              <span class="fill">FOR</span>
            </span>
            <span class="rule" aria-hidden="true"></span>
          </div>
          <div class="line title">
            <span class="word">
              <span class="stroke">HEISMAN</span>
              <span class="fill">HEISMAN</span>
            </span>
          </div>
          <div class="counter" id="counter">
            <div class="counter-rule" aria-hidden="true"></div>
            <div class="count-label">TIMES SAID</div>
            <div class="count-figure" id="count-figure" aria-hidden="true">
              <span class="count-sizer">
                <span class="count-slot"><span class="stroke">0</span><span class="fill">0</span></span>
                <span class="count-slot"><span class="stroke">0</span><span class="fill">0</span></span>
                <span class="count-slot"><span class="stroke">0</span><span class="fill">0</span></span>
                <span class="count-comma"><span class="stroke">,</span><span class="fill">,</span></span>
                <span class="count-slot"><span class="stroke">0</span><span class="fill">0</span></span>
                <span class="count-slot"><span class="stroke">0</span><span class="fill">0</span></span>
                <span class="count-slot"><span class="stroke">0</span><span class="fill">0</span></span>
              </span>
              <span class="count-value" id="count-value">
                <span class="count-slot is-leading" data-i="0"><span class="stroke">0</span><span class="fill">0</span></span>
                <span class="count-slot is-leading" data-i="1"><span class="stroke">0</span><span class="fill">0</span></span>
                <span class="count-slot is-leading" data-i="2"><span class="stroke">0</span><span class="fill">0</span></span>
                <span class="count-comma is-leading"><span class="stroke">,</span><span class="fill">,</span></span>
                <span class="count-slot is-leading" data-i="3"><span class="stroke">0</span><span class="fill">0</span></span>
                <span class="count-slot is-leading" data-i="4"><span class="stroke">0</span><span class="fill">0</span></span>
                <span class="count-slot" data-i="5"><span class="stroke">0</span><span class="fill">0</span></span>
              </span>
            </div>
            <div class="count-meter">
              <div class="count-track"><span class="count-fill" id="count-fill"></span></div>
              <span class="count-goal">/ 100,000</span>
            </div>
            <span class="sr-only" id="count-live" aria-live="polite">0 times said</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="state.js"></script>
  <script>
    (function () {
      var POSITIONS = {
        "bottom-center": 1,
        "top-center": 1,
        "center": 1,
        "bottom-left": 1,
        "bottom-right": 1,
        "top-left": 1,
        "top-right": 1
      };

      var DEFAULTS = {
        w: 1920,
        h: 1080,
        pos: "bottom-center",
        scale: 1,
        style: "block",
        anim: true,
        count: 0,
        room: "default"
      };

      var State = window.TikiHeismanState;

      var params = new URLSearchParams(window.location.search);

      function numParam(name, fallback, min, max) {
        if (!params.has(name)) return fallback;
        var raw = params.get(name);
        if (raw === null || String(raw).trim() === "") return fallback;
        var v = parseFloat(raw);
        if (!isFinite(v) || v < min || v > max) return fallback;
        return v;
      }

      function styleParam() {
        var raw = (params.get("style") || "").trim().toLowerCase();
        if (raw === "text" || raw === "loose" || raw === "outline") return "text";
        if (raw === "block" || raw === "badge" || raw === "plate") return "block";
        return DEFAULTS.style;
      }

      function animParam() {
        if (!params.has("anim") && !params.has("animation")) return DEFAULTS.anim;
        var raw = (params.get("anim") || params.get("animation") || "").trim().toLowerCase();
        if (raw === "" ) return DEFAULTS.anim;
        if (raw === "0" || raw === "off" || raw === "false" || raw === "no") return false;
        if (raw === "1" || raw === "on" || raw === "true" || raw === "yes") return true;
        return DEFAULTS.anim;
      }

      function posParam() {
        var raw = (params.get("pos") || "").trim().toLowerCase();
        return POSITIONS[raw] ? raw : DEFAULTS.pos;
      }

      function roomParam() {
        return State ? State.safeRoom(params.get("room")) : DEFAULTS.room;
      }

      var cfg = {
        w: Math.round(numParam("w", DEFAULTS.w, 100, 7680)),
        h: Math.round(numParam("h", DEFAULTS.h, 100, 4320)),
        pos: posParam(),
        scale: numParam("scale", DEFAULTS.scale, 0.15, 4),
        style: styleParam(),
        anim: animParam(),
        count: State ? State.clamp(numParam("count", DEFAULTS.count, 0, State.MAX)) : 0,
        room: roomParam()
      };

      var anchor = document.getElementById("anchor");
      var lockup = document.getElementById("lockup");
      var root = document.documentElement;
      var body = document.body;

      cfg.visible = true;

      function applyPresentation() {
        body.className = "style-" + cfg.style + (cfg.anim ? " anim-on" : " anim-off") + (cfg.visible ? "" : " is-hidden");
        document.getElementById("stage").setAttribute("aria-hidden", cfg.visible ? "false" : "true");
      }

      applyPresentation();

      root.style.setProperty("--stage-w", cfg.w + "px");
      root.style.setProperty("--stage-h", cfg.h + "px");
      root.style.setProperty("--scale", String(cfg.scale));

      function fitStage() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        if (window.visualViewport) {
          vw = window.visualViewport.width;
          vh = window.visualViewport.height;
        }
        var s = Math.min(vw / cfg.w, vh / cfg.h);
        if (!isFinite(s) || s <= 0) s = 1;
        root.style.setProperty("--fit-scale", String(s));
      }
      window.addEventListener("resize", fitStage, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fitStage, { passive: true });
      }
      fitStage();

      anchor.className = "anchor " + cfg.pos;

      var fontSize = Math.max(30, Math.round(Math.min(cfg.w, cfg.h * 1.777) * 0.043));
      var maxWidth = cfg.w * 0.90;

      function layout() {
        var px = fontSize;
        root.style.setProperty("--fs", px + "px");
        while (lockup.scrollWidth > maxWidth && px > 22) {
          px -= 2;
          root.style.setProperty("--fs", px + "px");
        }
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(layout).catch(layout);
      } else {
        layout();
      }
      setTimeout(layout, 50);

      var slots = document.querySelectorAll("#count-value .count-slot");
      var comma = document.querySelector("#count-value .count-comma");
      var fill = document.getElementById("count-fill");
      var live = document.getElementById("count-live");
      var figure = document.getElementById("count-figure");
      var counter = document.getElementById("counter");
      var popTimer = 0;

      function setGlyph(el, ch) {
        var stroke = el.querySelector(".stroke");
        var fillEl = el.querySelector(".fill");
        if (stroke) stroke.textContent = ch;
        if (fillEl) fillEl.textContent = ch;
      }

      function renderCount(n, meta) {
        n = State ? State.clamp(n) : Math.max(0, Math.round(n) || 0);
        var text = String(n);
        var padded = ("000000" + text).slice(-6);
        var firstShown = 6 - text.length;
        for (var i = 0; i < 6; i++) {
          setGlyph(slots[i], padded.charAt(i));
          if (i < firstShown) slots[i].classList.add("is-leading");
          else slots[i].classList.remove("is-leading");
        }
        if (n >= 1000) comma.classList.remove("is-leading");
        else comma.classList.add("is-leading");

        var goal = State ? State.GOAL : 100000;
        var pct = Math.max(0, Math.min(100, (n / goal) * 100));
        fill.style.width = pct + "%";
        if (n >= goal) counter.classList.add("is-goal");
        else counter.classList.remove("is-goal");

        var pretty = State ? State.format(n) : text;
        live.textContent = pretty + " times said, of 100,000";
        lockup.setAttribute("aria-label", "CJ Carr for Heisman, " + pretty + " times said");

        if (meta && meta.prev < n && meta.reason !== "init" && meta.reason !== "stored" && cfg.anim && cfg.visible) {
          figure.classList.remove("is-pop");
          void figure.offsetWidth;
          figure.classList.add("is-pop");
          clearTimeout(popTimer);
          popTimer = setTimeout(function () { figure.classList.remove("is-pop"); }, 450);
        }
      }

      function applyFlags(flags) {
        if (!flags) return;
        var anim = flags.cardAnim !== false;
        var visible = flags.cardVisible !== false;
        var changed = anim !== cfg.anim || visible !== cfg.visible;
        cfg.anim = anim;
        cfg.visible = visible;
        if (changed) applyPresentation();
      }

      renderCount(cfg.count, { prev: cfg.count, reason: "init" });

      if (State) {
        State.createCounter({
          role: "follower",
          initial: cfg.count,
          room: cfg.room,
          useStored: true,
          onChange: function (n, meta) {
            if (meta && meta.flags) applyFlags(meta.flags);
            renderCount(n, meta);
          }
        });
      }
    })();
  </script>
</body>
